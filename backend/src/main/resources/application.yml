spring:
  servlet:
    multipart:
      max-file-size: 11MB
      max-request-size: 11MB
  application:
    name: salary-management
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/salary_management}
    username: ${DATABASE_USER:salary_app}
    password: ${DATABASE_PASSWORD:}
  flyway:
    enabled: true
    validate-on-migrate: true
  session:
    store-type: jdbc
    timeout: 30m
    jdbc:
      initialize-schema: never
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: true
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
      show-details: never
      show-components: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  structured:
    format:
      console: logstash
