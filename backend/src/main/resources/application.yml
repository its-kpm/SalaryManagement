spring:
  application:
    name: salary-management
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/salary_management}
    username: ${DATABASE_USER:salary_app}
    password: ${DATABASE_PASSWORD:}
  flyway:
    enabled: true
    validate-on-migrate: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
